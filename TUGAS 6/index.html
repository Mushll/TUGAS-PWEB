<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Registrasi Mahasiswa</title>
  <link rel="stylesheet" href="../shared.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <a class="back" href="../">&larr; Kembali ke menu</a>
    <h1>Form Registrasi Mahasiswa</h1>
    <p class="lead">Ketik satu huruf atau lebih di kolom nama. Rekomendasi muncul, dan memilihnya mengisi NIM otomatis. Mata kuliah juga punya rekomendasi yang mengisi dosen pengampu.</p>

    <form id="registrationForm" class="card" novalidate>
      <label for="name">Nama mahasiswa</label>
      <div class="ac">
        <input type="text" id="name" autocomplete="off" role="combobox"
               aria-autocomplete="list" aria-expanded="false" aria-controls="nameList">
        <ul class="ac-list" id="nameList" role="listbox" hidden></ul>
      </div>
      <p class="field-error" id="nameError"></p>

      <label for="nim">NIM</label>
      <input type="text" id="nim" inputmode="numeric" autocomplete="off" maxlength="12">
      <p class="field-error" id="nimError"></p>

      <label for="course">Mata kuliah</label>
      <div class="ac">
        <input type="text" id="course" autocomplete="off" role="combobox"
               aria-autocomplete="list" aria-expanded="false" aria-controls="courseList">
        <ul class="ac-list" id="courseList" role="listbox" hidden></ul>
      </div>
      <p class="field-error" id="courseError"></p>

      <label for="lecturer">Dosen</label>
      <input type="text" id="lecturer" autocomplete="off">
      <p class="field-error" id="lecturerError"></p>

      <button type="submit">Daftar</button>
    </form>

    <section id="result" class="result" aria-live="polite" hidden></section>
  </main>
  <script src="script.js"></script>
</body>
</html>
